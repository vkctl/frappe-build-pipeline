name: Drain Prod Queue

# Runs every Sunday at 00:30 IST = Saturday 19:00 UTC.
# day-of-week 6 = Saturday UTC, which is Sunday 00:30 IST.
# If there's a pending promotion (you approved on Saturday), it pushes to prod.
# If nothing's pending, it exits quietly with no notification.
on:
  schedule:
    - cron: '0 19 * * 6'
  workflow_dispatch:   # also allow manual run, useful for testing

permissions:
  contents: write
  packages: write

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Check whether there's anything to promote. If not, exit cleanly.
      # We set an output so later steps can skip themselves.
      - name: Check for pending promotion
        id: check
        run: |
          if [ ! -f .state/pending-promotion.json ]; then
            echo "No pending promotion. Nothing to do."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(python3 -c "import json; print(json.load(open('.state/pending-promotion.json'))['staging_tag'])")
          APPROVED_BY=$(python3 -c "import json; print(json.load(open('.state/pending-promotion.json'))['approved_by'])")
          echo "Found pending promotion: $TAG (approved by $APPROVED_BY)"
          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "staging_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.check.outputs.pending == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.pending == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skip the promotion if the pending staging tag already matches prod.
      # This guards against a drain run where prod was somehow already updated
      # (e.g., previous drain partially succeeded), preventing a redundant
      # pull/retag/push cycle and a spurious Dokploy redeploy.
      - name: Check if staging already matches prod
        if: steps.check.outputs.pending == 'true'
        id: digest_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_TAG: ${{ steps.check.outputs.staging_tag }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          GHCR_TOKEN=$(curl -fsSL \
            -u "token:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/frappe_stack:pull" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('token') or d.get('access_token') or '')" \
            2>/dev/null) || GHCR_TOKEN=""

          get_digest() {
            [ -z "$GHCR_TOKEN" ] && { echo ""; return; }
            curl -sS -o /dev/null -D - \
              -H "Authorization: Bearer $GHCR_TOKEN" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${OWNER}/frappe_stack/manifests/$1" \
              | grep -i '^docker-content-digest:' \
              | awk '{print $2}' \
              | tr -d '\r\n'
          }

          STAGING_DIGEST=$(get_digest "$STAGING_TAG")
          PROD_DIGEST=$(get_digest "16-prod-latest")

          echo "Staging tag digest: ${STAGING_DIGEST:-<none>}"
          echo "Prod digest:        ${PROD_DIGEST:-<none>}"

          if [ -n "$PROD_DIGEST" ] && [ "$STAGING_DIGEST" = "$PROD_DIGEST" ]; then
            echo "Already promoted. Skipping redundant push."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Back up the CURRENT prod image before overwriting it.
      # Pulls :16-prod-latest, retags as :16-prod-backup, pushes.
      # If :16-prod-latest doesn't exist yet (very first promotion ever),
      # the pull fails — we catch that and continue, since there's nothing to back up.
      # Also captures the unique tag of what was backed up, so we can tell you in Telegram.
      - name: Back up current prod image
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        id: backup
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          CURRENT_PROD="ghcr.io/${OWNER}/frappe_stack:16-prod-latest"
          BACKUP_TAG="ghcr.io/${OWNER}/frappe_stack:16-prod-backup"

          echo "Attempting to back up current prod ($CURRENT_PROD)..."
          if docker pull "$CURRENT_PROD" 2>/dev/null; then
            # Get the unique tag this image originally had, via the org.opencontainers label
            # we'd ideally set at build time. For now, just record the digest for traceability.
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$CURRENT_PROD" 2>/dev/null || echo "unknown")
            echo "Current prod digest: $DIGEST"

            docker tag "$CURRENT_PROD" "$BACKUP_TAG"
            docker push "$BACKUP_TAG"
            echo "Backup pushed: $BACKUP_TAG"
            echo "backed_up=true" >> "$GITHUB_OUTPUT"
            echo "backup_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "No existing :16-prod-latest found (first promotion?). Nothing to back up."
            echo "backed_up=false" >> "$GITHUB_OUTPUT"
          fi

      # The actual promotion: pull the staging image, retag as prod, push.
      # No rebuild — same exact image bytes you tested on Saturday.
      - name: Promote staging image to prod
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        id: promote
        env:
          STAGING_TAG: ${{ steps.check.outputs.staging_tag }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          STAGING_FULL="ghcr.io/${OWNER}/frappe_stack:${STAGING_TAG}"
          # Replace "staging" -> "prod" in the tag name to keep the date/run-number traceable.
          PROD_UNIQUE_TAG="ghcr.io/${OWNER}/frappe_stack:${STAGING_TAG/staging/prod}"
          PROD_LATEST_TAG="ghcr.io/${OWNER}/frappe_stack:16-prod-latest"

          echo "Pulling $STAGING_FULL"
          docker pull "$STAGING_FULL"

          docker tag "$STAGING_FULL" "$PROD_UNIQUE_TAG"
          docker push "$PROD_UNIQUE_TAG"

          docker tag "$STAGING_FULL" "$PROD_LATEST_TAG"
          docker push "$PROD_LATEST_TAG"

          echo "prod_tag=$PROD_UNIQUE_TAG" >> "$GITHUB_OUTPUT"

      # Archive the pending file (audit trail) and commit. The catchup check on
      # the next Saturday run reads from GHCR directly, so we no longer need to
      # write last-promotion.json — the registry is the source of truth.
      - name: Archive pending promotion
        if: steps.check.outputs.pending == 'true'
        env:
          STAGING_TAG: ${{ steps.check.outputs.staging_tag }}
          SKIPPED: ${{ steps.digest_check.outputs.skip }}
        run: |
          mkdir -p .state/history
          DATE=$(date -u +%Y%m%d-%H%M%S)
          mv .state/pending-promotion.json ".state/history/promoted-${DATE}.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/
          if [ "$SKIPPED" = "true" ]; then
            git commit -m "Skip promotion (already in prod): $STAGING_TAG"
          else
            git commit -m "Promoted to prod: $STAGING_TAG"
          fi
          git push

      - name: Notify Telegram — already up to date
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip == 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.check.outputs.staging_tag }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=ℹ️ Drain skipped: $TAG is already the current prod image. No push needed."

      - name: Notify Telegram — prod live
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.promote.outputs.prod_tag }}
          BACKED_UP: ${{ steps.backup.outputs.backed_up }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          if [ "$BACKED_UP" = "true" ]; then
            BACKUP_LINE="Previous prod saved as :16-prod-backup (rollback available)."
          else
            BACKUP_LINE="No previous prod to back up (first promotion)."
          fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=🚀 Prod is live: $TAG
          $BACKUP_LINE"

      # Trigger Dokploy prod redeploy. We SSH into the same proxy server used
      # for staging deploys, then curl the prod webhook across the Netbird mesh.
      # continue-on-error: image is already pushed; webhook failure is informational.
      - name: Trigger Dokploy prod deploy
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DOKPLOY_SSH_HOST }}
          username: ${{ secrets.DOKPLOY_SSH_USER }}
          key: ${{ secrets.DOKPLOY_SSH_PRIVATE_KEY }}
          script: |
            curl -sS -f -X POST --max-time 30 "${{ secrets.DOKPLOY_PROD_WEBHOOK_URL }}"

      - name: Notify Telegram — prod deploy triggered
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=📤 Prod deploy webhook triggered on Dokploy."
