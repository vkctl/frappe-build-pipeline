name: Drain Prod Queue

# Runs every Sunday at 01:00 IST = Saturday 19:30 UTC.
# day-of-week 6 = Saturday UTC, which is Sunday 01:00 IST.
# If there's a pending promotion (you approved on Saturday), it pushes to prod.
# If nothing's pending, it exits quietly with no notification.
on:
  schedule:
    - cron: '30 19 * * 6'
  workflow_dispatch:   # also allow manual run, useful for testing

permissions:
  contents: write
  packages: write

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Check whether there's anything to promote. If not, exit cleanly.
      # We set an output so later steps can skip themselves.
      - name: Check for pending promotion
        id: check
        run: |
          if [ ! -f .state/pending-promotion.json ]; then
            echo "No pending promotion. Nothing to do."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(python3 -c "import json; d=json.load(open('.state/pending-promotion.json')); print(d.get('build_tag') or d['staging_tag'])")
          APPROVED_BY=$(python3 -c "import json; print(json.load(open('.state/pending-promotion.json'))['approved_by'])")
          # Digest frozen at approval time (Option A). May be empty for legacy
          # pending files written before this field existed — drain falls back to
          # resolving build_tag in that case.
          DIGEST=$(python3 -c "import json; print(json.load(open('.state/pending-promotion.json')).get('staging_digest',''))")
          echo "Found pending promotion: $TAG (approved by $APPROVED_BY)"
          echo "Frozen digest: ${DIGEST:-<none, legacy>}"
          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "build_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "staging_digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Skip the promotion if the pending staging tag already matches prod.
      # This guards against a drain run where prod was somehow already updated
      # (e.g., previous drain partially succeeded), preventing a redundant
      # pull/retag/push cycle and a spurious Dokploy redeploy.
      - name: Check if staging already matches prod
        if: steps.check.outputs.pending == 'true'
        id: digest_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TAG: ${{ steps.check.outputs.build_tag }}
          FROZEN_DIGEST: ${{ steps.check.outputs.staging_digest }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          GHCR_TOKEN=$(curl -fsSL \
            -u "token:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/frappe_stack:pull" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('token') or d.get('access_token') or '')" \
            2>/dev/null) || GHCR_TOKEN=""

          get_digest() {
            [ -z "$GHCR_TOKEN" ] && { echo ""; return; }
            curl -sS -o /dev/null -D - \
              -H "Authorization: Bearer $GHCR_TOKEN" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${OWNER}/frappe_stack/manifests/$1" \
              | grep -i '^docker-content-digest:' \
              | awk '{print $2}' \
              | tr -d '\r\n'
          }

          # Use the digest frozen at approval time. This is the same reference
          # promote checked, so promote and drain can never disagree (the bug that
          # caused queue-forever/drain-nothing). Fall back to resolving build_tag
          # only for legacy pending files written before staging_digest existed.
          if [ -n "$FROZEN_DIGEST" ]; then
            STAGING_DIGEST="$FROZEN_DIGEST"
          else
            STAGING_DIGEST=$(get_digest "$BUILD_TAG")
          fi
          PROD_DIGEST=$(get_digest "16-prod-latest")

          echo "Approved digest: ${STAGING_DIGEST:-<none>}"
          echo "Prod digest:     ${PROD_DIGEST:-<none>}"

          if [ -n "$PROD_DIGEST" ] && [ "$STAGING_DIGEST" = "$PROD_DIGEST" ]; then
            echo "Already promoted. Skipping redundant push."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Move the backup pointer to wherever prod-latest currently points.
      # Pure registry metadata operation — no image data transferred.
      - name: Move backup pointer
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        id: backup
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          CURRENT_PROD="ghcr.io/${OWNER}/frappe_stack:16-prod-latest"
          BACKUP_TAG="ghcr.io/${OWNER}/frappe_stack:16-prod-backup"

          if docker buildx imagetools inspect "$CURRENT_PROD" >/dev/null 2>&1; then
            docker buildx imagetools create --tag "$BACKUP_TAG" "$CURRENT_PROD"
            echo "Backup pointer → current prod."
            echo "backed_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing :16-prod-latest (first promotion). Skipping backup."
            echo "backed_up=false" >> "$GITHUB_OUTPUT"
          fi

      # Move the prod pointer to the approved build image.
      # No separate prod-specific tag is created — prod-latest just points into
      # the same build pool as staging-latest. Pure manifest pointer update.
      - name: Move prod pointer
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        id: promote
        env:
          BUILD_TAG: ${{ steps.check.outputs.build_tag }}
          FROZEN_DIGEST: ${{ steps.check.outputs.staging_digest }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PROD_LATEST="ghcr.io/${OWNER}/frappe_stack:16-prod-latest"

          # Promote by the frozen digest — the exact image approved on Saturday,
          # immune to last-build.json drift. build_tag is kept only for readable
          # commit messages / Telegram. Legacy pending files fall back to the tag.
          if [ -n "$FROZEN_DIGEST" ]; then
            SOURCE="ghcr.io/${OWNER}/frappe_stack@${FROZEN_DIGEST}"
            echo "Moving prod pointer → $SOURCE (build $BUILD_TAG)"
          else
            SOURCE="ghcr.io/${OWNER}/frappe_stack:${BUILD_TAG}"
            echo "Moving prod pointer → $SOURCE (legacy: no frozen digest)"
          fi
          docker buildx imagetools create --tag "$PROD_LATEST" "$SOURCE"

          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"

      # Archive the pending file (audit trail) and commit. The catchup check on
      # the next Saturday run reads from GHCR directly, so we no longer need to
      # write last-promotion.json — the registry is the source of truth.
      - name: Archive pending promotion
        if: steps.check.outputs.pending == 'true'
        env:
          BUILD_TAG: ${{ steps.check.outputs.build_tag }}
          SKIPPED: ${{ steps.digest_check.outputs.skip }}
        run: |
          mkdir -p .state/history
          DATE=$(date -u +%Y%m%d-%H%M%S)
          mv .state/pending-promotion.json ".state/history/promoted-${DATE}.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/
          if [ "$SKIPPED" = "true" ]; then
            git commit -m "Skip promotion (already in prod): $BUILD_TAG"
          else
            git commit -m "Promoted to prod: $BUILD_TAG"
          fi
          git push

      - name: Notify Telegram — already up to date
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip == 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.check.outputs.build_tag }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=ℹ️ Drain skipped: $TAG is already the current prod image. No push needed."

      - name: Notify Telegram — prod live
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.promote.outputs.build_tag }}
          BACKED_UP: ${{ steps.backup.outputs.backed_up }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          if [ "$BACKED_UP" = "true" ]; then
            BACKUP_LINE="Previous prod saved as :16-prod-backup (rollback available)."
          else
            BACKUP_LINE="No previous prod to back up (first promotion)."
          fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=🚀 Prod is live: $TAG
          $BACKUP_LINE"

      # Trigger Dokploy prod redeploy. We SSH into the same proxy server used
      # for staging deploys, then curl the prod webhook across the Netbird mesh.
      # continue-on-error: image is already pushed; webhook failure is informational.
      - name: Trigger Dokploy prod deploy
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DOKPLOY_SSH_HOST }}
          username: ${{ secrets.DOKPLOY_SSH_USER }}
          key: ${{ secrets.DOKPLOY_SSH_PRIVATE_KEY }}
          script: |
            curl -sS -f -X POST --max-time 30 "${{ secrets.DOKPLOY_PROD_WEBHOOK_URL }}"

      - name: Notify Telegram — prod deploy triggered
        if: steps.check.outputs.pending == 'true' && steps.digest_check.outputs.skip != 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=📤 Prod deploy webhook triggered on Dokploy."
