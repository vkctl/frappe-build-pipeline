name: Detect & Build Staging

# Runs every Saturday at 00:30 IST = Friday 19:00 UTC.
# Cron is in UTC. day-of-week 5 = Friday UTC, which is Saturday 00:30 IST.
on:
  schedule:
    - cron: '0 19 * * 5'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if no upstream changes detected'
        required: false
        default: 'false'

permissions:
  contents: write
  packages: write

jobs:
  detect-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Pre-flight: is last staging build still waiting for prod promotion?
      # If yes, skip this week's run entirely and Telegram a reminder.
      # We compare staging_tag from last-build.json against prod_tag from last-promotion.json.
      # No last-promotion.json yet (first time ever) → skip the check, proceed normally.
      - name: Check if previous staging was promoted
        id: catchup
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
        run: |
          STAGING_TAG=""
          PROD_TAG=""

          if [ -f .state/last-build.json ]; then
            STAGING_TAG=$(python3 -c "import json; print(json.load(open('.state/last-build.json')).get('staging_tag', ''))")
          fi
          if [ -f .state/last-promotion.json ]; then
            PROD_TAG=$(python3 -c "import json; print(json.load(open('.state/last-promotion.json')).get('source_staging_tag', ''))")
          fi

          echo "Current staging tag: ${STAGING_TAG:-<none>}"
          echo "Last promoted staging: ${PROD_TAG:-<none>}"

          # First-time scenarios: no staging yet, or no prod yet. Both are fine.
          if [ -z "$STAGING_TAG" ]; then
            echo "No prior staging build. Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PROD_TAG" ]; then
            echo "No prior prod promotion. Proceeding (first build ever or pre-promotion era)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Both exist — compare.
          if [ "$STAGING_TAG" = "$PROD_TAG" ]; then
            echo "Prod is caught up with staging. Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Previous staging ($STAGING_TAG) was never promoted to prod (currently on $PROD_TAG). Skipping this week's run."
            echo "skip=true" >> "$GITHUB_OUTPUT"

            # Telegram the reminder, only if secrets are set.
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              MSG="⚠️ Skipping this Saturday's staging build.

          Previous staging ($STAGING_TAG) is still pending prod promotion. Prod is on $PROD_TAG.

          Run 'Promote to Production' to clear the gap:
          https://github.com/$REPO/actions/workflows/promote-to-prod.yml

          After approval, the drain workflow will push to prod automatically Sunday 00:30 IST. Next Saturday's run can then proceed normally."
              curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
                -d "chat_id=$TG_CHAT" \
                --data-urlencode "text=$MSG" || true
            fi
          fi

      - name: Check upstream apps for changes
        id: check
        if: steps.catchup.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 check-upstream.py

      - name: Decide whether to build
        id: decide
        if: steps.catchup.outputs.skip != 'true'
        run: |
          if [ "${{ steps.check.outputs.changed }}" = "true" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No upstream changes detected. Skipping build."
          fi

      - name: Clone frappe_docker
        if: steps.decide.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Generate apps.json from upstream-apps.json
        if: steps.decide.outputs.build == 'true'
        working-directory: frappe_docker
        run: |
          # The detector wrote .state/current-versions.json at the repo root.
          # Copy it (and the config) into frappe_docker/ so the generator finds them.
          mkdir -p .state
          cp ../.state/current-versions.json .state/current-versions.json
          cp ../upstream-apps.json upstream-apps.json
          python3 ../generate-apps.py
          echo "---"
          echo "Generated apps.json:"
          cat apps.json

      - name: Compute tags
        if: steps.decide.outputs.build == 'true'
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          DATE=$(date -u +%Y%m%d)
          UNIQUE="16-staging-${DATE}-${{ github.run_number }}"
          echo "unique_tag=ghcr.io/${OWNER}/custom:${UNIQUE}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=ghcr.io/${OWNER}/custom:16-staging-latest" >> "$GITHUB_OUTPUT"
          echo "unique_only=${UNIQUE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.unique_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
          secret-files: |
            "apps_json=frappe_docker/apps.json"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update state file
        if: steps.decide.outputs.build == 'true'
        run: |
          python3 -c "
          import json
          data = json.load(open('.state/current-versions.json'))
          data['staging_tag'] = '${{ steps.tags.outputs.unique_only }}'
          data['built_at'] = '$(date -u +%Y-%m-%dT%H:%M:%SZ)'
          json.dump(data, open('.state/last-build.json', 'w'), indent=2)
          open('.state/last-build.json', 'a').write('\n')
          "

      - name: Commit state update
        if: steps.decide.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/last-build.json
          git diff --staged --quiet || git commit -m "Update build state: ${{ steps.tags.outputs.unique_only }}"
          git push

      - name: Notify Telegram — build complete
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ steps.check.outputs.summary }}
          TAG: ${{ steps.tags.outputs.unique_only }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set, skipping notification."
            exit 0
          fi
          MSG=$(cat <<EOF
          *Staging build complete (Saturday weekly)*

          Image: \`$TAG\`

          Changes:
          \`\`\`
          $SUMMARY
          \`\`\`

          When you're ready to push to prod, run the workflow manually:
          https://github.com/$REPO/actions/workflows/promote-to-prod.yml

          After approval, prod auto-pushes Sunday 00:30 IST. If you don't run it this week, next Saturday's build will be blocked with a reminder until you do.
          EOF
          )
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG"

      - name: Notify Telegram — no changes
        if: steps.decide.outputs.build == 'false'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=Saturday check: no upstream changes. No build this week."
