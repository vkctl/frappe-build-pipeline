name: Detect & Build Staging

# Runs every Saturday at 00:30 IST = Friday 19:00 UTC.
# Cron is in UTC. day-of-week 5 = Friday UTC, which is Saturday 00:30 IST.
on:
  schedule:
    - cron: '0 19 * * 5'
  workflow_dispatch:
    inputs:
      run_now:
        description: 'Trigger off-schedule; still skips if no upstream changes'
        required: false
        default: 'true'
        type: boolean
      force_rebuild:
        description: 'Rebuild even if nothing upstream has changed (wastes time, creates duplicate image)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  detect-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Pre-flight: is last staging build still waiting for prod promotion?
      # If yes, skip this week's run entirely and Telegram a reminder.
      #
      # This uses GHCR as the source of truth — we ask the registry for the
      # manifest digest of :16-staging-latest and :16-prod-latest, then compare.
      # If they match, prod points at the same image bytes as staging → caught up.
      # If they differ, staging has a newer image that hasn't been promoted yet.
      #
      # Advantage over reading .state/last-*.json files: this can't lie. Even if
      # someone manually retags via the GHCR UI, or state files get corrupted, the
      # check still reflects reality.
      - name: Check if previous staging was promoted (hash-based)
        id: catchup
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Exchange GITHUB_TOKEN for a proper GHCR registry token before hitting
          # the v2 manifests API. Using the raw GITHUB_TOKEN as a Bearer token
          # directly does not work — GHCR requires a token obtained via its
          # token endpoint.
          GHCR_TOKEN=$(curl -fsSL \
            -u "token:$GH_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/frappe_stack:pull" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('token') or d.get('access_token') or '')" \
            2>/dev/null) || GHCR_TOKEN=""

          # Helper: fetch the manifest digest for a tag via GHCR registry API.
          # Returns empty string if the tag doesn't exist (first build, etc).
          # The Accept header matters: container images can have multiple manifest
          # types, and we ask for them all so the digest header is populated.
          get_digest() {
            local tag="$1"
            [ -z "$GHCR_TOKEN" ] && { echo ""; return; }
            curl -sS -o /dev/null -D - \
              -H "Authorization: Bearer $GHCR_TOKEN" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${OWNER}/frappe_stack/manifests/${tag}" \
              | grep -i '^docker-content-digest:' \
              | awk '{print $2}' \
              | tr -d '\r\n'
          }

          STAGING_DIGEST=$(get_digest "16-staging-latest")
          PROD_DIGEST=$(get_digest "16-prod-latest")

          echo "Staging digest: ${STAGING_DIGEST:-<none>}"
          echo "Prod digest:    ${PROD_DIGEST:-<none>}"

          # First-run scenarios: registry returns no digest for one or both tags.
          if [ -z "$STAGING_DIGEST" ]; then
            echo "No :16-staging-latest in GHCR yet. First build, proceed."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PROD_DIGEST" ]; then
            echo "No :16-prod-latest in GHCR yet. Pre-promotion era, proceed."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Both exist — compare digests.
          if [ "$STAGING_DIGEST" = "$PROD_DIGEST" ]; then
            echo "Prod points at the same image as staging. Caught up, proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Staging and prod digests differ. Skipping this week's build until prod is promoted."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              MSG="⚠️ Skipping this Saturday's staging build.

          Staging is ahead of prod (different image digests). Promote staging to prod first:
          https://github.com/$REPO/actions/workflows/promote-to-prod.yml

          After approval, drain pushes to prod automatically Sunday 00:30 IST. Next Saturday's run can then proceed."
              curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
                -d "chat_id=$TG_CHAT" \
                --data-urlencode "text=$MSG" || true
            fi
          fi

      - name: Check upstream apps for changes
        id: check
        if: steps.catchup.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 check-upstream.py

      - name: Decide whether to build
        id: decide
        if: steps.catchup.outputs.skip != 'true'
        run: |
          # Build only if:
          #   - upstream actually changed (normal path), OR
          #   - the user explicitly asked for a no-op rebuild via force_rebuild.
          # `run_now` is implicit — it just makes us reach this step off-schedule,
          # but we still respect the change check unless force_rebuild is set.
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Upstream changes detected. Building."
          elif [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::warning::force_rebuild=true. Building duplicate image despite no upstream changes."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No upstream changes. Skipping build (pass force_rebuild=true to override)."
          fi

      - name: Clone frappe_docker
        if: steps.decide.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Generate apps.json from upstream-apps.json
        if: steps.decide.outputs.build == 'true'
        working-directory: frappe_docker
        run: |
          # The detector wrote .state/current-versions.json at the repo root.
          # Copy it (and the config) into frappe_docker/ so the generator finds them.
          mkdir -p .state
          cp ../.state/current-versions.json .state/current-versions.json
          cp ../upstream-apps.json upstream-apps.json
          python3 ../generate-apps.py
          echo "---"
          echo "Generated apps.json:"
          cat apps.json

      - name: Compute tags
        if: steps.decide.outputs.build == 'true'
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          DATE=$(date -u +%Y%m%d)
          UNIQUE="16-build-${DATE}-${{ github.run_number }}"
          echo "unique_tag=ghcr.io/${OWNER}/frappe_stack:${UNIQUE}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=ghcr.io/${OWNER}/frappe_stack:16-staging-latest" >> "$GITHUB_OUTPUT"
          echo "unique_only=${UNIQUE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.unique_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
          secret-files: |
            "apps_json=frappe_docker/apps.json"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update state file
        if: steps.decide.outputs.build == 'true'
        run: |
          python3 -c "
          import json
          data = json.load(open('.state/current-versions.json'))
          data['build_tag'] = '${{ steps.tags.outputs.unique_only }}'
          data['built_at'] = '$(date -u +%Y-%m-%dT%H:%M:%SZ)'
          json.dump(data, open('.state/last-build.json', 'w'), indent=2)
          open('.state/last-build.json', 'a').write('\n')
          "

      - name: Commit state update
        if: steps.decide.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/last-build.json
          git diff --staged --quiet || git commit -m "Update build state: ${{ steps.tags.outputs.unique_only }}"
          git push

      - name: Notify Telegram — build complete
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ steps.check.outputs.summary }}
          TAG: ${{ steps.tags.outputs.unique_only }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set, skipping notification."
            exit 0
          fi
          MSG=$(cat <<EOF
          *Staging build complete (Saturday weekly)*

          Image: \`$TAG\`

          Changes:
          \`\`\`
          $SUMMARY
          \`\`\`

          When you're ready to push to prod, run the workflow manually:
          https://github.com/$REPO/actions/workflows/promote-to-prod.yml

          After approval, prod auto-pushes Sunday 00:30 IST. If you don't run it this week, next Saturday's build will be blocked with a reminder until you do.
          EOF
          )
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG"

      # Trigger Dokploy staging redeploy by SSHing into the deploy proxy server
      # (which is the staging Dokploy host itself) and hitting the webhook from
      # inside the Netbird mesh.
      #
      # continue-on-error: a failed deploy trigger shouldn't fail the build
      # (the image is already pushed). We log loudly but let the workflow finish.
      - name: Trigger Dokploy staging deploy
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DOKPLOY_SSH_HOST }}
          username: ${{ secrets.DOKPLOY_SSH_USER }}
          key: ${{ secrets.DOKPLOY_SSH_PRIVATE_KEY }}
          # `script` runs on the remote server. Curl options:
          # -sS    silent but show errors
          # -f     fail (non-zero exit) on HTTP error codes
          # -X POST  Dokploy webhooks expect POST
          # --max-time 30   don't hang forever
          script: |
            curl -sS -f -X POST --max-time 30 "${{ secrets.DOKPLOY_STAGE_WEBHOOK_URL }}"

      - name: Notify Telegram — staging deploy triggered
        if: steps.decide.outputs.build == 'true'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=📤 Staging deploy webhook triggered on Dokploy."

      - name: Notify Telegram — no changes
        if: steps.decide.outputs.build == 'false'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          curl -sS -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=Saturday check: no upstream changes. No build this week."
